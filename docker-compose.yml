version: '3.8'

services:
  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: leadflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: leadflow_db
      POSTGRES_USER: leadflow_user
      POSTGRES_PASSWORD: leadflow_secure_password_replace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadflow_user -d leadflow_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Job Queue & Distributed Rate Limiting) ──────────────────────────
  redis:
    image: redis:7-alpine
    container_name: leadflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Web Server ─────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadflow-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://leadflow_user:leadflow_secure_password_replace@postgres:5432/leadflow_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-leadflow_super_secret_production_key_minimum_32_characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-54eO49uV2JgI7e9FqQ3P6x7V0A5b2N1M4K8L9O2P3Q=}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-leadflow_prod_api_key_replace}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-meta/llama-3.1-70b-instruct}
    command: >
      sh -c "alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2"

  # ── Campaign Worker (Durable Job Consumer) ─────────────────────────────────
  campaign-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leadflow-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://leadflow_user:leadflow_secure_password_replace@postgres:5432/leadflow_db
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-leadflow_super_secret_production_key_minimum_32_characters}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-54eO49uV2JgI7e9FqQ3P6x7V0A5b2N1M4K8L9O2P3Q=}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:-leadflow_prod_api_key_replace}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://integrate.api.nvidia.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-meta/llama-3.1-70b-instruct}
    command: ["python", "workers/campaign_worker.py"]

volumes:
  postgres_data:
  redis_data:
