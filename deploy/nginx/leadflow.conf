# LeadFlow AI — Production Nginx Configuration
# Place in /etc/nginx/sites-available/leadflow.conf and symlink to /etc/nginx/sites-enabled/

# Rate limiting zones: 30 req/sec per IP, burst up to 50
limit_req_zone $binary_remote_addr zone=leadflow_api_zone:10m rate=30r/s;
limit_req_status 429;

# Upstream Uvicorn ASGI cluster (Unix socket or localhost loopback)
upstream leadflow_backend {
    server 127.0.0.1:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name outreach.yourdomain.com;

    # Direct access & Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location /static/ {
        alias /opt/leadflow-ai/dashboard/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location /health/ {
        proxy_pass http://leadflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=leadflow_api_zone burst=50 nodelay;
        proxy_pass http://leadflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}

# Main HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name outreach.yourdomain.com;

    # SSL TLS termination & modern ciphers (Mozilla intermediate profile)
    ssl_certificate /etc/letsencrypt/live/outreach.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/outreach.yourdomain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data:; connect-src 'self';" always;

    # Max upload limit for CSV imports (25MB)
    client_max_body_size 25M;
    client_body_buffer_size 128k;

    # Logging
    access_log /var/log/nginx/leadflow_access.log combined buffer=512k flush=1m;
    error_log /var/log/nginx/leadflow_error.log warn;

    # Serve static assets directly from disk with client caching
    location /static/ {
        alias /opt/leadflow-ai/dashboard/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Public health checks bypass rate limiting
    location /health/ {
        proxy_pass http://leadflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API & Dashboard reverse proxy
    location / {
        limit_req zone=leadflow_api_zone burst=50 nodelay;

        proxy_pass http://leadflow_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering for real-time responsiveness
        proxy_buffering off;
    }
}
